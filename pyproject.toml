[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# E/W: pycodestyle  F: pyflakes  I: isort  B: bugbear  UP: pyupgrade
# C4: flake8-comprehensions  SIM: flake8-simplify
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]
ignore = [
    "E501",   # line-too-long — handled by formatter
    "B008",   # do-not-perform-function-call-in-default-argument (FastAPI Depends pattern)
    "UP007",  # use-x-or-y-for-union — X | Y syntax requires runtime support we control
    "SIM108", # ternary-operator — sometimes less readable
]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy ORM models use string forward references in Mapped["Type"] annotations.
# These resolve via the mapper registry at runtime — F821 (undefined name) is expected.
"services/payments-svc/app/db/models/*.py" = ["F821"]
"services/account-svc/app/db/models/*.py" = ["F821"]
# Test files: allow assert statements and magic values
"services/payments-svc/tests/**/*.py" = ["S101", "S105", "S106"]
"services/account-svc/tests/**/*.py" = ["S101", "S105", "S106"]
"shared/tests/**/*.py" = ["S101", "S105", "S106"]
# Alembic migrations (per-service): allow unused imports (SA types imported for
# column definitions) and skip isort (I001) — migration files are auto-generated by
# Alembic and their import ordering is not meaningful; I001 changes across ruff versions.
"**/migrations/versions/*.py" = ["F401", "I001"]
# env.py imports after sys.path manipulation (E402) and is order-insensitive (I001).
"**/migrations/env.py" = ["E402", "I001", "F401"]
# Service entrypoints call init_sentry() before framework imports so the Sentry
# SDK can instrument httpx/FastAPI — the late imports are intentional.
"services/*/main.py" = ["E402"]

[tool.ruff.lint.isort]
# Cross-cutting infra package; treat as first-party so isort groups it with `app`.
known-first-party = ["app", "fixmytext_shared"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.bandit]
exclude_dirs = ["services/payments-svc/tests", "services/account-svc/tests", "shared/tests", ".venv"]
skips = ["B101", "B601"]
