# Release Build Gate
# Triggered when a GitHub Release is published, or manually via workflow_dispatch.
# Validates that a release is shippable: builds every Dockerfile in the repo
# for linux/amd64 + linux/arm64, scans each image with Trivy, and uploads the
# results to GitHub Security. Nothing is published anywhere — Docker Hub
# publishing was removed when the monolith image (velobits/fixmytext-backend)
# was decommissioned in favour of per-service images built at deploy time.
#
# Tag convention: vX.Y.Z or vX.Y.Z-<prerelease> (e.g. v1.0.1, v1.1.0-rc.1).
name: Release Build Gate

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build from"
        required: false
        default: "main"
        type: string
      tag:
        description: "Release tag to validate (e.g. v1.0.0 or v1.0.0-beta.1)"
        required: true
        type: string

permissions:
  contents: read
  security-events: write

concurrency:
  group: cd-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Validate tag and derive version
        id: ver
        # Tags come in via env, not direct ${{ }} interpolation in the script
        # body — git refnames allow $, (, ) and backticks, which would execute
        # in the runner before the regex below ever rejects them.
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="$DISPATCH_TAG"
          else
            TAG="$RELEASE_TAG"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::Tag '$TAG' does not match v<major>.<minor>.<patch>[-prerelease]"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${TAG#v}"

  build:
    name: Build & Scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [validate]
    # Every Dockerfile in the repo. All builds use the repo root as context —
    # each Dockerfile COPYs shared/ (and the migrate image copies two service
    # trees), so a service-dir context would break the build.
    # version_arg: the four service Dockerfiles consume APP_VERSION (baked into
    # ENV VERSION and the OCI version label); the migrate Dockerfile takes no
    # build args.
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: account-svc
            dockerfile: services/account-svc/Dockerfile
            version_arg: true
          - image: ai-svc
            dockerfile: services/ai-svc/Dockerfile
            version_arg: true
          - image: text-svc
            dockerfile: services/text-svc/Dockerfile
            version_arg: true
          - image: payments-svc
            dockerfile: services/payments-svc/Dockerfile
            version_arg: true
          - image: migrate
            dockerfile: Dockerfile.migrate
            version_arg: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event.release.tag_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build multi-arch image (validation only, no push)
        # Validates the cross-build for both platforms. The arm64 leg builds
        # under QEMU emulation; the gcc-less python:3.12-slim base means any
        # dependency without an aarch64 wheel fails here fast — which is the
        # point of the gate.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: ${{ matrix.version_arg && format('APP_VERSION={0}', needs.validate.outputs.version) || '' }}
          cache-from: type=gha,scope=cd-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=cd-${{ matrix.image }}

      - name: Load amd64 image for scanning
        # Buildx cannot --load a multi-platform build; rebuild the amd64 leg
        # from the warm cache so Trivy has a local image to scan.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: fixmytext-${{ matrix.image }}:${{ needs.validate.outputs.version }}
          build-args: ${{ matrix.version_arg && format('APP_VERSION={0}', needs.validate.outputs.version) || '' }}
          cache-from: type=gha,scope=cd-${{ matrix.image }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: fixmytext-${{ matrix.image }}:${{ needs.validate.outputs.version }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: cd-image-scan-${{ matrix.image }}

      # ── Gate: a release is not shippable with fixable CRITICAL/HIGH vulns
      # (mirrors the M-12 hard gate in ci.yml).
      - name: Trivy gate (${{ matrix.image }})
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: fixmytext-${{ matrix.image }}:${{ needs.validate.outputs.version }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  summary:
    name: Release gate summary
    runs-on: ubuntu-latest
    needs: [validate, build]
    if: always()
    steps:
      - name: Write run summary
        run: |
          {
            echo "## Release Build Gate — ${{ needs.validate.outputs.tag }}"
            echo ""
            echo "**Version:** \`${{ needs.validate.outputs.version }}\`"
            echo "**Build result:** ${{ needs.build.result }}"
            echo ""
            echo "Images validated (multi-arch linux/amd64 + linux/arm64, Trivy-scanned):"
            echo ""
            echo "- account-svc"
            echo "- ai-svc"
            echo "- text-svc"
            echo "- payments-svc"
            echo "- migrate"
            echo ""
            echo "_No images are published — this workflow is a build/scan gate only._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any build failed
        if: needs.build.result != 'success'
        run: |
          echo "::error::One or more release builds failed"
          exit 1
