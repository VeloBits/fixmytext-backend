# Deploy to Docker Hub
# Triggered when a GitHub Release is published. Builds a multi-arch
# (linux/amd64, linux/arm64) image, pushes it to Docker Hub with semver
# fan-out tags (1.0.1, 1.0, 1, latest, sha-<short>), scans the published
# image with Trivy, and syncs the Docker Hub README.
#
# Tag convention: vX.Y.Z or vX.Y.Z-<prerelease> (e.g. v1.0.1, v1.1.0-rc.1).
# Prereleases skip the `latest` tag.
name: Deploy to Docker Hub

on:
  release:
    types: [published]

permissions:
  contents: read
  security-events: write

concurrency:
  group: cd-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  IMAGE_NAME: velobits/fixmytext-backend

jobs:
  publish:
    name: Build & Publish to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate tag and derive version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::Tag '$TAG' does not match v<major>.<minor>.<patch>[-prerelease]"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Release version: $VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
            type=sha,prefix=sha-,format=short

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Scan published image with Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          format: sarif
          output: trivy-published.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
        with:
          sarif_file: trivy-published.sarif
          category: cd-image-scan

      - name: Sync Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          short-description: "FastAPI backend for FixMyText — 200+ text transformation tools with AI writing assistance."
          readme-filepath: ./README.md

      - name: Write run summary
        run: |
          {
            echo "## Deployed to Docker Hub"
            echo ""
            echo "**Image:** \`${{ env.IMAGE_NAME }}\`"
            echo "**Version:** \`${{ env.VERSION }}\`"
            echo "**Digest:** \`${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "### Tags pushed"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "**Docker Hub:** https://hub.docker.com/r/velobits/fixmytext-backend/tags"
          } >> "$GITHUB_STEP_SUMMARY"
