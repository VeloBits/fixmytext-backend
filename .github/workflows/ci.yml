# Test & Build
# Runs on all PRs and pushes to main.
# Enforces lint, type safety, tests with coverage, security scanning,
# and Docker build validation.
name: Backend Test & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to test"
        required: false
        default: "main"
        type: string
      jobs:
        description: "Jobs to run"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - lint
          - test
          - security
          - docker

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ── Compatibility shim ─────────────────────────────────────────────────────
  # Branch protection requires "Lint & Format Check" (the old monolith job name).
  # This summary job satisfies that requirement once all per-service matrix jobs pass.
  lint-check:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    needs: [lint]
    if: always()
    steps:
      - name: All lint jobs passed
        run: |
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "One or more lint jobs failed"
            exit 1
          fi
          echo "All lint and format checks passed"

  lint:
    name: Lint & Format (${{ matrix.service }})
    runs-on: ubuntu-latest
    # One matrix entry per service. Add a new entry when a new service is extracted.
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ai-svc
            path: services/ai-svc
            ruff_target: "services/ai-svc/app/ services/ai-svc/tests/"
          - service: text-svc
            path: services/text-svc
            ruff_target: "services/text-svc/app/ services/text-svc/tests/"
          - service: payments-svc
            path: services/payments-svc
            ruff_target: "services/payments-svc/app/ services/payments-svc/tests/ services/payments-svc/migrations/"
          - service: account-svc
            path: services/account-svc
            ruff_target: "services/account-svc/app/ services/account-svc/tests/ services/account-svc/migrations/"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        # Pin version to match local pyproject.toml / pre-commit config.
        # Upgrade intentionally to avoid silent behaviour changes across CI runs.
        run: pip install "ruff==0.15.9"

      - name: Check formatting
        run: ruff format --check ${{ matrix.ruff_target }}

      - name: Lint
        run: ruff check ${{ matrix.ruff_target }}

  shared-tests:
    name: Shared Package Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install shared package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e './shared[test]'

      - name: Run shared package tests
        run: pytest shared/tests -v

  test:
    name: Tests & Coverage
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'test'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/testdb
      SECRET_KEY: test-secret-key-at-least-32-characters-long-for-ci
      DEBUG: "true"
      ALLOWED_ORIGINS: '["http://localhost:3000"]'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install account-svc dependencies
        # Run from repo root so -e ./shared in requirements.txt resolves to
        # backend/shared/ (the editable package directory).
        run: |
          python -m pip install --upgrade pip
          pip install -r services/account-svc/requirements.txt

      - name: Run account-svc tests with coverage
        working-directory: services/account-svc
        env:
          KEYCLOAK_JWKS_URL: "http://test-keycloak:8080/realms/test/protocol/openid-connect/certs"
        run: |
          pytest \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: services/account-svc/coverage.xml

  security:
    name: Security Scan
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'security'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/account-svc/requirements.txt
          pip install pip-audit

      - name: Audit dependencies for known vulnerabilities
        # PYSEC-2025-183 (PyJWT) is ignored — no fix version exists upstream yet.
        # Track: https://github.com/jpadilla/pyjwt/issues — remove once patched.
        run: pip-audit --strict --vulnerability-service osv --ignore-vuln PYSEC-2025-183

  docker:
    name: Docker Build & Scan
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'docker'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Build account-svc Docker image
        run: docker build -t account-svc:${{ github.sha }} -f services/account-svc/Dockerfile .

      - name: Build ai-svc Docker image
        run: docker build -t ai-svc:${{ github.sha }} -f services/ai-svc/Dockerfile .

      - name: Build text-svc Docker image
        run: docker build -t text-svc:${{ github.sha }} -f services/text-svc/Dockerfile .

      - name: Build payments-svc Docker image
        run: docker build -t payments-svc:${{ github.sha }} -f services/payments-svc/Dockerfile .

      - name: Build migrate Docker image
        run: docker build -t migrate:${{ github.sha }} -f Dockerfile.migrate .

      # Informational scan of one image -> GitHub Security tab (kept for the SARIF
      # view). The hard gate below is what actually fails the build (M-12).
      - name: Trivy SARIF (account-svc, Security tab)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: 'account-svc:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      # ── Gate: fail the build on any CRITICAL/HIGH (fixable) vuln in any of the
      # service images (M-12). A red CI here blocks the CI-gated Railway deploy
      # (.github/workflows/deploy-railway.yml) from ever shipping the image.
      - name: Trivy gate (account-svc)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: 'account-svc:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Trivy gate (ai-svc)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: 'ai-svc:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Trivy gate (text-svc)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: 'text-svc:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Trivy gate (payments-svc)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: 'payments-svc:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Trivy gate (migrate)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: 'migrate:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

  create-release:
    name: Create Sentry Release
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history needed so sentry-cli can walk commits to find the
          # previous release SHA. Shallow clones (depth=1) cause the error:
          # "Could not find the SHA of the previous release in the git history."
          fetch-depth: 0
      - name: Install sentry-cli
        run: curl -sL https://sentry.io/get-cli/ | bash
      - name: Create Sentry release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: fixmytext-backend
        run: |
          sentry-cli releases new "${{ github.sha }}"
          sentry-cli releases set-commits "${{ github.sha }}" --auto --ignore-missing
          sentry-cli releases finalize "${{ github.sha }}"
