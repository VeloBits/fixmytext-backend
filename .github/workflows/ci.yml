# Backend CI Pipeline
# Runs on all PRs and pushes to main.
# Enforces lint, type safety, tests with coverage, security scanning,
# and Docker build validation.
name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint & Format (${{ matrix.service }})
    runs-on: ubuntu-latest
    # Matrix scaffolding for the strangler-fig split. Today only `monolith`
    # is populated; each future service extraction adds a matrix entry so
    # adding ai-svc / text-svc / etc. is a mechanical YAML change.
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: monolith
            ruff_target: "services/monolith/app/ services/monolith/tests/ shared/"
          - service: ai-svc
            path: services/ai-svc
            ruff_target: "services/ai-svc/app/ services/ai-svc/tests/"
          - service: text-svc
            path: services/text-svc
            ruff_target: "services/text-svc/app/ services/text-svc/tests/"
          - service: payments-svc
            path: services/payments-svc
            ruff_target: "services/payments-svc/app/ services/payments-svc/tests/"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Check formatting
        run: ruff format --check ${{ matrix.ruff_target }}

      - name: Lint
        run: ruff check ${{ matrix.ruff_target }}

  shared-tests:
    name: Shared Package Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install shared package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e './shared[test]'

      - name: Run shared package tests
        run: pytest shared/tests -v

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/testdb
      SECRET_KEY: test-secret-key-at-least-32-characters-long-for-ci
      DEBUG: "true"
      ALLOWED_ORIGINS: '["http://localhost:3000"]'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        working-directory: services/monolith
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        working-directory: services/monolith
        run: |
          pytest \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/monolith/requirements.txt
          pip install pip-audit

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit --strict --vulnerability-service osv

  docker:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - name: Build monolith Docker image
        run: docker build -t backend:${{ github.sha }} -f services/monolith/Dockerfile .

      - name: Build ai-svc Docker image
        run: docker build -t ai-svc:${{ github.sha }} -f services/ai-svc/Dockerfile .

      - name: Build text-svc Docker image
        run: docker build -t text-svc:${{ github.sha }} -f services/text-svc/Dockerfile .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: 'backend:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  create-release:
    name: Create Sentry Release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install sentry-cli
        run: curl -sL https://sentry.io/get-cli/ | bash
      - name: Create Sentry release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: fixmytext-backend
        run: |
          sentry-cli releases new "${{ github.sha }}"
          sentry-cli releases set-commits "${{ github.sha }}" --auto
          sentry-cli releases finalize "${{ github.sha }}"
