# Test & Build
# Runs on all PRs and pushes to main/develop.
# Enforces lint, per-service tests with calibrated coverage gates, dependency
# audits, Docker build validation for every Dockerfile in the repo, image
# vulnerability scanning (informational SARIF + hard Trivy gates, M-12), and
# gateway config validation (Kong, docker-compose). Traefik and Keycloak
# validation moved to the VeloBits/velobits-infra repo with the configs.
#
# A successful run of this workflow is what gates the Railway deploy
# (.github/workflows/deploy-railway.yml, workflow_run on "Backend Test &
# Build") - a red job here blocks the deploy (H-7).
#
# Branch protection note: the *-check summary jobs exist to keep the legacy
# required-status-check names ("Lint & Format Check", "Tests & Coverage",
# "Security Scan", "Docker Build & Scan") stable while the real work runs in
# per-service matrix jobs. Do not rename them without updating branch
# protection first.
name: Backend Test & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to test"
        required: false
        default: "main"
        type: string
      jobs:
        description: "Jobs to run"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - lint
          - test
          - security
          - docker
          - gateway

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ── Lint ───────────────────────────────────────────────────────────────────

  lint:
    name: Lint & Format (${{ matrix.service }})
    runs-on: ubuntu-latest
    # One matrix entry per service. Add a new entry when a new service is
    # extracted. Each service owns its alembic chain under
    # services/<svc>/migrations/, linted with the service.
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ai-svc
            ruff_target: "services/ai-svc/app/ services/ai-svc/tests/"
          - service: text-svc
            ruff_target: "services/text-svc/app/ services/text-svc/tests/"
          - service: payments-svc
            ruff_target: "services/payments-svc/app/ services/payments-svc/tests/ services/payments-svc/migrations/"
          - service: account-svc
            ruff_target: "services/account-svc/app/ services/account-svc/tests/ services/account-svc/migrations/"
          - service: shared
            ruff_target: "shared/"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        # Pin version to avoid silent behaviour changes across CI runs.
        run: pip install "ruff==0.15.9"

      - name: Check formatting
        run: ruff format --check ${{ matrix.ruff_target }}

      - name: Lint
        run: ruff check ${{ matrix.ruff_target }}

  # Branch protection requires "Lint & Format Check" (the old monolith job name).
  # This summary job satisfies that requirement once all per-service matrix jobs pass.
  lint-check:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    needs: [lint]
    if: always()
    steps:
      - name: All lint jobs passed
        run: |
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "One or more lint jobs failed"
            exit 1
          fi
          echo "All lint and format checks passed"

  # ── Tests ──────────────────────────────────────────────────────────────────

  test:
    name: Test (${{ matrix.service }})
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'test'
    runs-on: ubuntu-latest
    # Coverage thresholds are floors calibrated to measured coverage (2026-07
    # post-merge: account 82%, ai 99%, payments 95%, text 99%), rounded down
    # to leave headroom. Raise a threshold when you add tests; never lower one
    # to get a PR green.
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: account-svc
            cov_threshold: 80
          - service: ai-svc
            cov_threshold: 95
            # arq is intentionally absent from requirements.txt (its redis<6
            # pin conflicts with the pinned redis); the Dockerfile installs it
            # with --no-deps - mirror that here or test collection fails on
            # `import arq` in app/worker/tasks.py.
            extra_install: pip install --no-deps arq==0.28.0
          - service: payments-svc
            cov_threshold: 90
          - service: text-svc
            cov_threshold: 95
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/testdb
      SECRET_KEY: test-secret-key-at-least-32-characters-long-for-ci
      DEBUG: "true"
      ALLOWED_ORIGINS: '["http://localhost:3100"]'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        # Run from repo root so -e ./shared in requirements.txt resolves to
        # shared/ (the editable package directory).
        run: |
          python -m pip install --upgrade pip
          pip install -r services/${{ matrix.service }}/requirements.txt

      - name: Install extra dependencies
        if: matrix.extra_install
        run: ${{ matrix.extra_install }}

      - name: Run tests with coverage
        working-directory: services/${{ matrix.service }}
        env:
          KEYCLOAK_JWKS_URL: "http://test-keycloak:8080/realms/test/protocol/openid-connect/certs"
        run: |
          pytest \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=${{ matrix.cov_threshold }} \
            -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage.xml

  shared-tests:
    name: Shared Package Tests
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: shared/pyproject.toml

      - name: Install shared package + test deps
        # pytest-cov is installed explicitly - the [test] extra doesn't carry it.
        run: |
          python -m pip install --upgrade pip
          pip install -e './shared[test]' pytest-cov

      - name: Run shared package tests with coverage
        # Floor calibrated to measured 100% coverage (2026-07 post-merge),
        # backed off to 95 so a single uncovered branch doesn't block merges.
        working-directory: shared
        run: |
          pytest \
            --cov=fixmytext_shared \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=95 \
            -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-shared
          path: shared/coverage.xml

  # Branch protection may require "Tests & Coverage" (the old single-job name).
  # This summary job satisfies that requirement once all test jobs pass.
  test-check:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: [test, shared-tests]
    if: always()
    steps:
      - name: All test jobs passed
        # "skipped" is accepted so workflow_dispatch subsets (jobs=lint etc.)
        # don't report a failure for work that was intentionally not run.
        run: |
          for result in "${{ needs.test.result }}" "${{ needs.shared-tests.result }}"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "One or more test jobs failed"
              exit 1
            fi
          done
          echo "All test jobs passed"

  # ── Security ───────────────────────────────────────────────────────────────

  security:
    name: Security Audit (${{ matrix.service }})
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'security'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: account-svc
          - service: ai-svc
            # arq ships in the production image via --no-deps (see
            # services/ai-svc/Dockerfile) - install it here too so the audit
            # covers everything the image actually runs.
            extra_install: pip install --no-deps arq==0.28.0
          - service: payments-svc
          - service: text-svc
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/${{ matrix.service }}/requirements.txt
          pip install pip-audit

      - name: Install extra dependencies
        if: matrix.extra_install
        run: ${{ matrix.extra_install }}

      - name: Audit dependencies for known vulnerabilities
        # PYSEC-2025-183 (PyJWT) is ignored - no fix version exists upstream yet.
        # Track: https://github.com/jpadilla/pyjwt/issues - remove once patched.
        run: pip-audit --strict --vulnerability-service osv --ignore-vuln PYSEC-2025-183

  # Branch protection may require "Security Scan" (the old single-job name).
  security-check:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [security]
    if: always()
    steps:
      - name: All security audits passed
        run: |
          if [ "${{ needs.security.result }}" != "success" ] && [ "${{ needs.security.result }}" != "skipped" ]; then
            echo "One or more security audits failed"
            exit 1
          fi
          echo "All security audits passed"

  # ── Docker ─────────────────────────────────────────────────────────────────

  docker:
    name: Docker Build (${{ matrix.image }})
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'docker'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    # Every Dockerfile in the repo. All builds use the repo root as context -
    # each Dockerfile COPYs shared/ (and the migrate image copies two service
    # trees), so a service-dir context would break the build.
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: account-svc
            dockerfile: services/account-svc/Dockerfile
          - image: ai-svc
            dockerfile: services/ai-svc/Dockerfile
          - image: text-svc
            dockerfile: services/text-svc/Dockerfile
          - image: payments-svc
            dockerfile: services/payments-svc/Dockerfile
          - image: migrate
            dockerfile: Dockerfile.migrate
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Build ${{ matrix.image }} Docker image
        run: docker build -t ${{ matrix.image }}:${{ github.sha }} -f ${{ matrix.dockerfile }} .

      # Informational scan -> GitHub Security tab (SARIF view). The hard gate
      # below is what actually fails the build (M-12).
      - name: Trivy SARIF (${{ matrix.image }}, Security tab)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: '${{ matrix.image }}:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-${{ matrix.image }}.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
        if: always()
        with:
          sarif_file: 'trivy-${{ matrix.image }}.sarif'
          category: ci-image-scan-${{ matrix.image }}

      # ── Gate: fail the build on any CRITICAL/HIGH (fixable) vuln (M-12).
      # A red CI here blocks the CI-gated Railway deploy
      # (.github/workflows/deploy-railway.yml) from ever shipping the image.
      - name: Trivy gate (${{ matrix.image }})
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: '${{ matrix.image }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

  # Branch protection may require "Docker Build & Scan" (the old single-job name).
  docker-check:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: [docker]
    if: always()
    steps:
      - name: All Docker builds passed
        run: |
          if [ "${{ needs.docker.result }}" != "success" ] && [ "${{ needs.docker.result }}" != "skipped" ]; then
            echo "One or more Docker builds failed"
            exit 1
          fi
          echo "All Docker builds passed"

  # ── Gateway config validation ───────────────────────────────────────────────
  # Kong runs from an upstream image with mounted config (no Dockerfile), so CI
  # validates the config against the exact image tag pinned in
  # docker-compose.yml instead of building anything. Traefik and Keycloak
  # validation (router checks, realm JSON, realm import gate) moved to the
  # VeloBits/velobits-infra repo together with those configs.

  gateway:
    name: Gateway & Infra Config Validation
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'gateway'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Validate Kong declarative config
        # Parses gateway/kong/kong.yml (routes, plugins) with the same image
        # tag compose runs. Exit code is the gate.
        run: |
          docker run --rm -e KONG_DATABASE=off \
            -v "$PWD/gateway/kong/kong.yml:/kong.yml:ro" \
            kong:3.8-ubuntu kong config parse /kong.yml

      - name: Validate docker-compose config
        # env_file: .env is required:true in compose, so synthesize a stub.
        # The interpolation-only vars get dummies to silence warnings.
        # velobits-proxy-net is external (created manually) -
        # `config` only renders, so the network doesn't need to exist here.
        run: |
          printf '%s\n' \
            'POSTGRES_PASSWORD=ci-stub' \
            'SESSION_COOKIE_SECRET=ci-stub' \
            'REDIS_PASSWORD=ci-stub' > .env
          docker compose --profile dev config -q
          rm -f .env

  # ── Sentry release ─────────────────────────────────────────────────────────

  create-release:
    name: Create Sentry Release
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history needed so sentry-cli can walk commits to find the
          # previous release SHA. Shallow clones (depth=1) cause the error:
          # "Could not find the SHA of the previous release in the git history."
          fetch-depth: 0
      - name: Install sentry-cli
        run: curl -sL https://sentry.io/get-cli/ | bash
      - name: Create Sentry release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: fixmytext-backend
        run: |
          sentry-cli releases new "${{ github.sha }}"
          sentry-cli releases set-commits "${{ github.sha }}" --auto --ignore-missing
          sentry-cli releases finalize "${{ github.sha }}"
