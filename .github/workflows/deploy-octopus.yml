# Manual any-branch deployment via Octopus Deploy.
#
# Run from the Actions tab ("Deploy via Octopus" → Run workflow → pick a
# branch). Stages the runtime files, pushes a zip package to the Octopus
# built-in feed, and creates a release:
#   main             → "Release" channel          (Development → Production)
#   any other branch → "Feature branches" channel (Development only)
# Optionally auto-deploys the release to Development (default on). Promotion to
# Production is always a manual step in the Octopus portal.
#
# Service images are NOT built here: the target is an Ampere A1 (arm64) and a
# stock GitHub runner produces amd64 binaries that will not run on it. The
# package ships sources and octopus/deploy.sh builds on the VM, where Docker's
# layer cache makes unchanged rebuilds fast. (This repo also publishes no images
# anywhere — cd.yml is a build/scan gate only.)
#
# CI GATE (H-7): the selected commit must have a green "Backend Test & Build"
# run. A red or missing CI run blocks the deploy — the same guarantee the
# retired Railway pipeline gave via workflow_run, kept here as an explicit check
# so the pipeline can still be triggered manually on any branch.
#
# Auth is OIDC (OctopusDeploy/login) — no long-lived API key stored in GitHub.
# Required Actions variables (org-level preferred so all VeloBits repos share
# them; repo-level works too):
#   vars.OCTOPUS_URL                  e.g. https://velobits.octopus.app
#   vars.OCTOPUS_SERVICE_ACCOUNT_ID   ID of the shared service account
#                                     github-actions-velobits-oidc (this repo's
#                                     OIDC identity, incl. immutable GitHub IDs:
#                                     repo:VeloBits@146367091/fixmytext-backend@1192930434:ref:*)
#   vars.OCTOPUS_SPACE                space name (defaults to "Default")
# Full setup runbook: docs/octopus-deployment.md
name: Deploy via Octopus

on:
  workflow_dispatch:
    inputs:
      deploy_to_development:
        description: Deploy the release to Development after creating it
        type: boolean
        default: true

permissions:
  contents: read
  actions: read # read sibling workflow runs for the CI gate
  id-token: write # OIDC token exchange with Octopus

# Serialize releases so run numbers reach Octopus in order; Octopus itself
# queues concurrent deployments per project/environment.
concurrency:
  group: octopus-deploy
  cancel-in-progress: false

env:
  OCTOPUS_SPACE: ${{ vars.OCTOPUS_SPACE || 'Default' }}
  OCTOPUS_PROJECT: fixmytext-backend
  PACKAGE_ID: fixmytext-backend

jobs:
  release:
    name: Package & release to Octopus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Require green CI for this commit
        # Deploying an untested commit is the failure mode this gate exists to
        # prevent, so a missing run is treated as failure, not as "skip".
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "Backend Test & Build")]
                  | sort_by(.run_number) | last | .conclusion // "missing"')
          echo "Backend Test & Build for ${GITHUB_SHA}: ${conclusion}"
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI for this commit is '${conclusion}' — refusing to deploy. Push the commit and let 'Backend Test & Build' pass first."
            exit 1
          fi

      - name: Compute release version + channel
        id: meta
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            VERSION="1.0.${GITHUB_RUN_NUMBER}"
            CHANNEL="Release"
          else
            # A SemVer prerelease tag derived from the branch name routes the
            # release into the Development-only "Feature branches" channel.
            SLUG=$(printf '%s' "$GITHUB_REF_NAME" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' \
              | cut -c1-40)
            VERSION="0.0.${GITHUB_RUN_NUMBER}-${SLUG:-branch}"
            CHANNEL="Feature branches"
          fi
          # Re-runs must not collide with the package pushed by attempt 1.
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            VERSION="${VERSION}.${GITHUB_RUN_ATTEMPT}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION channel=$CHANNEL"

      - name: Stage runtime files
        # What the VM needs: both compose files, the Octopus deploy assets, the
        # Kong declarative config, and every build input the Dockerfiles COPY
        # (each service tree plus shared/, with the repo root as build context).
        # .dockerignore ships too — it keeps the on-VM build context lean and
        # keeps the rendered .env out of image layers.
        #
        # Deliberately excluded: docker-compose.override.yml (local Swagger port
        # mappings — deploy.sh passes -f explicitly so it would not be merged
        # anyway, but shipping it invites confusion) and tests/caches.
        run: |
          mkdir -p staging/octopus
          cp docker-compose.yml docker-compose-prod.yml Dockerfile.migrate \
             .dockerignore staging/
          cp -r gateway staging/gateway
          cp -r infrastructure staging/infrastructure
          cp octopus/deploy.sh octopus/env.dev.template octopus/env.prod.template \
             octopus/docker-compose.deploy.yml staging/octopus/
          rsync -a \
            --exclude 'tests/' --exclude '__pycache__/' --exclude '*.pyc' \
            --exclude '.pytest_cache/' --exclude '.ruff_cache/' \
            --exclude '.venv/' --exclude '*.egg-info/' --exclude 'htmlcov/' \
            services/ staging/services/
          rsync -a \
            --exclude 'tests/' --exclude '__pycache__/' --exclude '*.pyc' \
            --exclude '.pytest_cache/' --exclude '.ruff_cache/' \
            --exclude '.venv/' --exclude '*.egg-info/' --exclude 'htmlcov/' \
            shared/ staging/shared/
          # Fail here rather than at `docker compose build` on the VM.
          for required in \
            staging/docker-compose.yml \
            staging/docker-compose-prod.yml \
            staging/octopus/deploy.sh \
            staging/gateway/kong/kong.yml \
            staging/shared/pyproject.toml \
            staging/services/account-svc/Dockerfile \
            staging/services/ai-svc/Dockerfile \
            staging/services/text-svc/Dockerfile \
            staging/services/payments-svc/Dockerfile; do
            test -e "$required" || { echo "::error::missing from package: $required"; exit 1; }
          done
          echo "staged $(find staging -type f | wc -l) files"

      # Octopus actions are tag-pinned for now; Renovate
      # (helpers:pinGitHubActionDigests) pins them to digests on its next run.
      - name: Log in to Octopus (OIDC)
        uses: OctopusDeploy/login@v1
        with:
          server: ${{ vars.OCTOPUS_URL }}
          service_account_id: ${{ vars.OCTOPUS_SERVICE_ACCOUNT_ID }}

      - name: Create zip package
        uses: OctopusDeploy/create-zip-package-action@v3
        with:
          package_id: ${{ env.PACKAGE_ID }}
          version: ${{ steps.meta.outputs.version }}
          base_path: staging
          # .dockerignore is listed explicitly — glob matchers commonly skip
          # dotfiles, and the on-VM build needs it at the package root.
          files: |
            **/*
            .dockerignore
          output_folder: packaged

      - name: Push package to Octopus built-in feed
        uses: OctopusDeploy/push-package-action@v3
        with:
          packages: packaged/${{ env.PACKAGE_ID }}.${{ steps.meta.outputs.version }}.zip

      - name: Create release
        id: release
        uses: OctopusDeploy/create-release-action@v3
        with:
          project: ${{ env.OCTOPUS_PROJECT }}
          channel: ${{ steps.meta.outputs.channel }}
          release_number: ${{ steps.meta.outputs.version }}
          package_version: ${{ steps.meta.outputs.version }}

      - name: Deploy to Development
        if: inputs.deploy_to_development
        id: deploy
        uses: OctopusDeploy/deploy-release-action@v3
        with:
          project: ${{ env.OCTOPUS_PROJECT }}
          release_number: ${{ steps.release.outputs.release_number }}
          environments: Development

      - name: Wait for Development deployment to finish
        if: inputs.deploy_to_development
        uses: OctopusDeploy/await-task-action@v3
        with:
          server_task_id: ${{ fromJson(steps.deploy.outputs.server_tasks)[0].serverTaskId }}

      - name: Job summary
        run: |
          {
            echo "## Octopus release"
            echo "- **Version:** \`${{ steps.meta.outputs.version }}\`"
            echo "- **Channel:** ${{ steps.meta.outputs.channel }}"
            echo "- **Branch:** \`$GITHUB_REF_NAME\`"
            echo "- **Dev API:** https://api-dev.fixmytext.velobits.dev"
            echo "- Promote to Production (https://api.fixmytext.velobits.dev) from the Octopus portal — Release-channel versions only."
          } >> "$GITHUB_STEP_SUMMARY"
