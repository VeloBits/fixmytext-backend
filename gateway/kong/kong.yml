_format_version: "3.0"
_transform: true

# ──────────────────────────────────────────────────────────────────────────────
# Kong API gateway — declarative configuration.
# All /api/v1/* traffic is routed to the appropriate microservice.
# The monolith catch-all has been removed; every path is now explicit.
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ── ai-svc (Groq-backed AI endpoints) ────────────────────────────────────────
  - name: ai-svc
    url: http://ai-svc:8000
    routes:
      - name: ai-routes
        paths:
          - /api/v1/ai
        strip_path: false
    plugins:
      - name: request-size-limiting
        config:
          allowed_payload_size: 1
      # Coarse anti-abuse limit — in-app per-user AI quota is the enforcement layer.
      - name: rate-limiting
        config:
          minute: 30
          hour: 300
          policy: local
          fault_tolerant: true
          hide_client_headers: false

  # ── text-svc (local text-transform tools) ────────────────────────────────
  - name: text-svc
    url: http://text-svc:8000
    routes:
      - name: text-routes
        paths:
          - /api/v1/text
        strip_path: false
    plugins:
      - name: request-size-limiting
        config:
          allowed_payload_size: 1
      - name: rate-limiting
        config:
          minute: 120
          hour: 1200
          policy: local
          fault_tolerant: true
          hide_client_headers: false

  # ── payments-svc (Razorpay subscriptions, passes) ─────────────────────────
  - name: payments-svc
    url: http://payments-svc:8000
    routes:
      - name: passes-routes
        paths:
          - /api/v1/passes
        strip_path: false
      - name: subscription-routes
        paths:
          - /api/v1/subscription
        strip_path: false
    plugins:
      - name: request-size-limiting
        config:
          allowed_payload_size: 1
      - name: rate-limiting
        config:
          minute: 30
          hour: 300
          policy: local
          fault_tolerant: true
          hide_client_headers: false

  # ── account-svc (auth, user data, history, share) ─────────────────────────
  - name: account-svc
    url: http://account-svc:8000
    routes:
      - name: auth-routes
        paths:
          - /api/v1/auth
        strip_path: false
      - name: user-routes
        paths:
          - /api/v1/user
        strip_path: false
      - name: history-routes
        paths:
          - /api/v1/history
        strip_path: false
      - name: share-routes
        paths:
          - /api/v1/share
        strip_path: false
      - name: health-route
        paths:
          - /health
        strip_path: false
    plugins:
      - name: request-size-limiting
        config:
          allowed_payload_size: 1
      - name: rate-limiting
        config:
          minute: 60
          hour: 600
          policy: local
          fault_tolerant: true
          hide_client_headers: false

plugins:
  # Inject / echo X-Request-ID on every request so it appears in service
  # logs and downstream traces.
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true

  # Single source of truth for CORS at the edge.
  - name: cors
    config:
      origins:
        - http://localhost:3000
        - http://127.0.0.1:3000
        - http://develop-fixmytext.velobits.dev
        - https://fixmytext.velobits.dev
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Content-Type
        - Authorization
        - X-Visitor-Id
        - X-Request-ID
        - baggage
        - traceparent
        - tracestate
        - sentry-trace
      credentials: true
      max_age: 3600

# Note: Kong rate-limiting above uses policy=local (per-node counters).
# In a multi-node Kong deployment, switch to policy=redis and configure
# redis_host/redis_port to share counters across instances. The in-app
# per-user quota (fixmytext_shared.rate_limit) remains the enforcement layer;
# Kong limits are a coarse anti-abuse guard.
