plugins:
  # Inject / echo X-Request-ID on every request so it appears in monolith
  # logs and downstream traces.
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true

  # Replicate the monolith's existing CORS middleware behaviour at the edge.
  # When the monolith stops emitting CORS headers (a future refactor when
  # auth moves out of the monolith), this is the single source of truth.
  - name: cors
    config:
      origins:
        - http://localhost:3000
        - http://127.0.0.1:3000
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Content-Type
        - Authorization
        - X-Visitor-Id
        - X-Request-ID
      credentials: true
      max_age: 3600

# Rate-limit plugin intentionally NOT enabled at the gateway yet.
# In-app rate limiting (fixmytext_shared.rate_limit) remains source-of-truth
# so behaviour is identical pre- and post-gateway. TODO: migrate to Kong's
# rate-limit plugin when a service splits out (the AI quota check has the
# most to gain from edge-side enforcement).
