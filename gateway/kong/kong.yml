_format_version: "3.0"
_transform: true

# ──────────────────────────────────────────────────────────────────────────────
# Kong proxies 100% of /api/v1/* and /health traffic to the monolith today.
# Commented placeholders for the planned service routes preserve the layout —
# uncomment as each service comes online.
# ──────────────────────────────────────────────────────────────────────────────

services:
  - name: monolith
    url: http://backend-dev:8000
    routes:
      - name: api-v1-catchall
        paths:
          - /api/v1
        strip_path: false
        preserve_host: true
      - name: health
        paths:
          - /health
        strip_path: false
    plugins:
      - name: request-size-limiting
        config:
          allowed_payload_size: 1   # 1 MB

