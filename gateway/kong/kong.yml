_format_version: "3.0"
_transform: true

# ──────────────────────────────────────────────────────────────────────────────
# Kong API gateway - declarative configuration.
# All /api/v1/* traffic is routed to the appropriate microservice.
# The monolith catch-all has been removed; every path is now explicit.
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ── ai-svc (Groq-backed AI endpoints) ────────────────────────────────────────
  - name: ai-svc
    url: http://ai-svc:8000
    routes:
      - name: ai-routes
        paths:
          - /api/v1/ai
        strip_path: false
    plugins:
      - name: request-size-limiting
        config:
          allowed_payload_size: 1
      # Coarse anti-abuse limit - in-app per-user AI quota is the enforcement layer.
      - name: rate-limiting
        config:
          minute: 30
          hour: 300
          policy: local
          fault_tolerant: true
          hide_client_headers: false

  # ── text-svc (local text-transform tools) ────────────────────────────────
  - name: text-svc
    url: http://text-svc:8000
    routes:
      - name: text-routes
        paths:
          - /api/v1/text
        strip_path: false
    plugins:
      - name: request-size-limiting
        config:
          allowed_payload_size: 1
      - name: rate-limiting
        config:
          minute: 120
          hour: 1200
          policy: local
          fault_tolerant: true
          hide_client_headers: false

  # ── payments-svc (Razorpay subscriptions, passes) ─────────────────────────
  - name: payments-svc
    url: http://payments-svc:8000
    routes:
      - name: passes-routes
        paths:
          - /api/v1/passes
        strip_path: false
      - name: subscription-routes
        paths:
          - /api/v1/subscription
        strip_path: false
    plugins:
      - name: request-size-limiting
        config:
          allowed_payload_size: 1
      - name: rate-limiting
        config:
          minute: 30
          hour: 300
          policy: local
          fault_tolerant: true
          hide_client_headers: false

  # ── account-svc (auth, user data, history, share) ─────────────────────────
  - name: account-svc
    url: http://account-svc:8000
    routes:
      - name: auth-routes
        paths:
          - /api/v1/auth
        strip_path: false
      - name: user-routes
        paths:
          - /api/v1/user
        strip_path: false
      - name: history-routes
        paths:
          - /api/v1/history
        strip_path: false
      - name: share-routes
        paths:
          - /api/v1/share
        strip_path: false
      - name: health-route
        paths:
          - /health
        strip_path: false
    plugins:
      - name: request-size-limiting
        config:
          allowed_payload_size: 1
      # Coarse anti-abuse guard. Keyed per client IP and shared across all
      # account-svc routes: one SPA page load fires ~10 bootstrap reads
      # (auth/me + user data), so the budget must absorb rapid refreshes -
      # at 60/min a handful of reloads exhausted it and every bootstrap
      # call 429'd. Per-user quotas remain the in-app enforcement layer.
      - name: rate-limiting
        config:
          minute: 300
          hour: 3000
          policy: local
          fault_tolerant: true
          hide_client_headers: false

plugins:
  # Inject / echo X-Request-ID on every request so it appears in service
  # logs and downstream traces.
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true

  # Single source of truth for CORS at the edge. Origins follow the platform
  # hostname convention (velobits-infra/traefik/README.md):
  #   local   http://localhost:3100
  #   dev     https://fixmytext-dev[-<app>].velobits.dev
  #   prod    https://fixmytext[-<app>].velobits.dev
  # Keep in sync with ALLOWED_ORIGINS in .env (the per-service FastAPI fallback
  # for direct hits that bypass Kong, e.g. Swagger).
  #
  # NOTE: this one declarative file is mounted by BOTH the dev and the prod
  # stack, so the list is the union of both environments — the prod API
  # therefore also accepts the dev frontend origins. Acceptable while both are
  # first-party and pre-launch; split into a prod-only declarative config
  # before the prod frontend carries real user sessions.
  - name: cors
    config:
      origins:
        - http://localhost:3100
        - http://127.0.0.1:3100
        - https://fixmytext-dev.velobits.dev
        - https://fixmytext-dev-editor.velobits.dev
        - https://fixmytext-dev-analytics.velobits.dev
        - https://fixmytext-dev-content.velobits.dev
        - https://fixmytext-dev-shell.velobits.dev
        - https://fixmytext.velobits.dev
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Content-Type
        - Authorization
        - X-Visitor-Id
        - X-Request-ID
        - baggage
        - traceparent
        - tracestate
        - sentry-trace
      credentials: true
      max_age: 3600

# Note: Kong rate-limiting above uses policy=local (per-node counters).
# In a multi-node Kong deployment, switch to policy=redis and configure
# redis_host/redis_port to share counters across instances. The in-app
# per-user quota (fixmytext_shared.rate_limit) remains the enforcement layer;
# Kong limits are a coarse anti-abuse guard.
