# Railway service configuration for FixMyText Backend.
# Docs: https://docs.railway.com/reference/config-as-code
#
# Railway builds the image from this repo's Dockerfile on every push to the
# watched branch. The Docker Hub publish (cd.yml) is a separate release
# artifact and does NOT trigger Railway.
#
# Branch -> environment mapping is set in the Railway dashboard, not here:
#   Service -> Settings -> Source -> Branch
#     production env  -> watches `main`
#     development env -> watches `develop`

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway injects $PORT at runtime; override Dockerfile CMD to bind to it.
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1

# ── Environment-specific overrides ───────────────────────────────────────────

[environments.production.deploy]
restartPolicyType = "ALWAYS"
numReplicas = 1

[environments.development.deploy]
restartPolicyType = "ON_FAILURE"
numReplicas = 1
