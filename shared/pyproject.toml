[project]
name = "fixmytext-shared"
version = "0.1.0"
description = "Shared utilities for FixMyText microservices (config, observability, middleware, rate limiting, JWT verification)"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.14.2",
    "sentry-sdk[fastapi]>=2.18",
    "opentelemetry-api>=1.34",
    "opentelemetry-sdk>=1.34",
    "opentelemetry-exporter-otlp-proto-http>=1.34",
    "redis[hiredis]>=7.4",
    "PyJWT[crypto]>=2.13.0",
    "httpx>=0.28",
    "cachetools>=5.5",
    "starlette>=0.40",
    "fastapi>=0.118",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "cryptography>=44.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["fixmytext_shared*"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# Mirrors the monolith's lint posture so the matrix CI job uses identical config.
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]
ignore = [
    "E501",   # line-too-long — handled by formatter
    "B008",   # do-not-perform-function-call-in-default-argument (FastAPI Depends)
    "UP007",  # use-x-or-y-for-union
    "SIM108", # ternary-operator — sometimes less readable
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["fixmytext_shared"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
