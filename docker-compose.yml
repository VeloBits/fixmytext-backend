# fixmytext-backend — unified compose file with profiles.
#
# Profiles:
#   dev   development stack  (hot reload, source volumes, Traefik on :80)
#   prod  production stack   (multi-stage builds, TLS)
#
# Local development requires /etc/hosts entries (see backend/README.md):
#   127.0.0.1 auth-dev.velobits.dev
#   127.0.0.1 api-dev.velobits.dev
#   127.0.0.1 develop-fixmytext.velobits.dev
#
# Usage:
#   docker compose --profile dev up --build     # dev
#   docker compose --profile prod up --build    # prod
#
services:

  # ══════════════════════════════════════════════════════════════════════════
  # TRAEFIK — edge reverse proxy for all *.velobits.dev subdomains.
  # Owns external port :80. Routes by Host header to the right container.
  # ══════════════════════════════════════════════════════════════════════════

  traefik:
    profiles: ["dev"]
    image: traefik:latest
    container_name: velobits-traefik
    restart: unless-stopped
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=fixmytext-net
      # file provider activates path-prefix routing for content-app vs web-app
      - --providers.file.directory=/etc/traefik/rules
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --log.level=INFO
    ports:
      - "80:80"
      - "127.0.0.1:8090:8080"   # dashboard, localhost-only
    environment:
      # Pin Docker API version so Traefik's SDK doesn't fall back to 1.24,
      # which newer Docker Engine daemons (min 1.40) reject.
      DOCKER_API_VERSION: "1.47"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./gateway/traefik/rules:/etc/traefik/rules:ro
    networks:
      - fixmytext-net


  # ══════════════════════════════════════════════════════════════════════════
  # PRODUCT DATABASES (velobits-dev-db Postgres instance)
  # Hosts fixmytext + chat + notes + futureapp databases. NEVER hosts
  # Keycloak's identity DB (which is a separate Postgres instance below).
  # ══════════════════════════════════════════════════════════════════════════

  db-service:
    image: pgvector/pgvector:pg16
    container_name: velobits-dev-db
    restart: unless-stopped
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: fixmytext
      # Fail fast if unset rather than booting with a known weak default (M-13).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: fixmytext
    volumes:
      - fixmytext-pgdata:/var/lib/postgresql/data
      # First-init only: creates placeholder DBs for future products
      - ./infrastructure/db-init:/docker-entrypoint-initdb.d:ro
    networks:
      - fixmytext-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixmytext -d fixmytext"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s


  # ══════════════════════════════════════════════════════════════════════════
  # REDIS  —  shared across profiles (optional, for distributed rate limiting)
  # ══════════════════════════════════════════════════════════════════════════

  redis-service:
    image: redis:8-alpine
    container_name: fixmytext-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    networks:
      - fixmytext-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5


  # ══════════════════════════════════════════════════════════════════════════
  # PGBOUNCER  —  connection pooler in transaction mode (dev profile).
  # Services route through :6432 when PGBOUNCER_URL is set in .env.
  # Caps total server-side connections at PGBOUNCER_DEFAULT_POOL_SIZE=20 while
  # allowing up to 200 client-side connections, preventing Postgres
  # max_connections exhaustion under multi-replica deployments.
  # ══════════════════════════════════════════════════════════════════════════

  pgbouncer:
    image: edoburu/pgbouncer:latest
    profiles: ["dev"]
    container_name: fixmytext-pgbouncer
    environment:
      - DB_HOST=db-service
      - DB_PORT=5432
      - DB_NAME=fixmytext
      - DB_USER=fixmytext
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=200
      - DEFAULT_POOL_SIZE=20
    ports:
      - "6432:6432"
    depends_on:
      db-service:
        condition: service_healthy
    networks:
      - fixmytext-net


  # ══════════════════════════════════════════════════════════════════════════
  # MIGRATE  —  runs alembic upgrade head once, then exits.
  # ══════════════════════════════════════════════════════════════════════════

  migrate-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: migrations/Dockerfile.migrate
    container_name: fixmytext-migrate-dev
    restart: "no"
    working_dir: /app
    command: ["alembic", "-c", "migrations/alembic.ini", "upgrade", "head"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://fixmytext:${POSTGRES_PASSWORD}@db-service:5432/fixmytext
    depends_on:
      db-service:
        condition: service_healthy
    networks:
      - fixmytext-net

  # ══════════════════════════════════════════════════════════════════════════
  # AI-SVC  —  Groq-backed AI text transformation service (dev profile)
  # Kong routes /api/v1/ai/* here. Service is internal-only (Kong owns
  # the path-prefix seam; Traefik owns the subdomain seam).
  # ══════════════════════════════════════════════════════════════════════════

  ai-svc:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: services/ai-svc/Dockerfile
    container_name: fixmytext-ai-svc
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=true
      - OTEL_SERVICE_NAME=fixmytext-ai-svc
      - OTEL_EXPORTER_OTLP_ENDPOINT=
    depends_on:
      redis-service:
        condition: service_started
    networks:
      - fixmytext-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ══════════════════════════════════════════════════════════════════════════
  # AI-WORKER  —  arq worker that executes async Groq jobs enqueued by ai-svc.
  # Runs the same Docker image as ai-svc but with the arq entrypoint.
  # ══════════════════════════════════════════════════════════════════════════

  ai-worker:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: services/ai-svc/Dockerfile
    container_name: fixmytext-ai-worker
    command: ["python", "-m", "arq", "app.worker.main.WorkerSettings"]
    env_file:
      - .env
    environment:
      - OTEL_SERVICE_NAME=fixmytext-ai-worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=
    depends_on:
      redis-service:
        condition: service_started
    networks:
      - fixmytext-net
    healthcheck:
      test: ["CMD", "python", "-c", "import redis; redis.from_url('redis://redis-service:6379/0').ping()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ══════════════════════════════════════════════════════════════════════════
  # TEXT-SVC  —  local text transformation service (dev profile)
  # Kong routes /api/v1/text/* here.
  # ══════════════════════════════════════════════════════════════════════════

  text-svc:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: services/text-svc/Dockerfile
    container_name: fixmytext-text-svc
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - OTEL_SERVICE_NAME=fixmytext-text-svc
      - OTEL_EXPORTER_OTLP_ENDPOINT=
    networks:
      - fixmytext-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ══════════════════════════════════════════════════════════════════════════
  # PAYMENTS-SVC  —  billing: passes, credits, subscriptions, Razorpay (dev)
  # Kong routes /api/v1/passes/* and /api/v1/subscription/* here.
  # ══════════════════════════════════════════════════════════════════════════

  payments-svc:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: services/payments-svc/Dockerfile
    container_name: fixmytext-payments-svc
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - OTEL_SERVICE_NAME=fixmytext-payments-svc
      - OTEL_EXPORTER_OTLP_ENDPOINT=
      - DATABASE_URL=postgresql+asyncpg://fixmytext:${POSTGRES_PASSWORD}@db-service:5432/fixmytext
    depends_on:
      db-service:
        condition: service_healthy
      redis-service:
        condition: service_started
    networks:
      - fixmytext-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ══════════════════════════════════════════════════════════════════════════
  # ACCOUNT-SVC  —  user data, history, share, session cookie (dev profile)
  # Kong routes /api/v1/auth/*, /api/v1/user/*, /api/v1/history/*,
  # /api/v1/share/* here.
  # ══════════════════════════════════════════════════════════════════════════

  account-svc:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: services/account-svc/Dockerfile
    container_name: fixmytext-account-svc
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - OTEL_SERVICE_NAME=fixmytext-account-svc
      - OTEL_EXPORTER_OTLP_ENDPOINT=
      - DATABASE_URL=postgresql+asyncpg://fixmytext:${POSTGRES_PASSWORD}@db-service:5432/fixmytext
      - SESSION_COOKIE_SECRET=${SESSION_COOKIE_SECRET}
      - SESSION_COOKIE_NAME=${SESSION_COOKIE_NAME:-fixmytext_session}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - SESSION_COOKIE_MAX_AGE=${SESSION_COOKIE_MAX_AGE:-604800}
      - SESSION_COOKIE_DOMAIN=${SESSION_COOKIE_DOMAIN:-}
      - KEYCLOAK_URL=${KEYCLOAK_URL:-http://auth-dev.velobits.dev}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-Velobits-Dev}
      - KEYCLOAK_JWKS_URL=${KEYCLOAK_JWKS_URL:-http://keycloak-dev:8080/realms/${KEYCLOAK_REALM:-Velobits-Dev}/protocol/openid-connect/certs}
    depends_on:
      db-service:
        condition: service_healthy
      redis-service:
        condition: service_started
    networks:
      - fixmytext-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ══════════════════════════════════════════════════════════════════════════
  # KONG  —  API gateway. Behind Traefik; routes /api/v1/* to services.
  # No longer owns external port :8000 — Traefik routes api-dev.velobits.dev
  # to this container via Docker labels.
  # ══════════════════════════════════════════════════════════════════════════

  kong:
    profiles: ["dev"]
    image: kong:3.8-ubuntu
    container_name: fixmytext-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "127.0.0.1:8001"
    volumes:
      - ./gateway/kong/kong.yml:/etc/kong/kong.yml:ro
    # Port 8000 is published to the host so the browser can reach Kong directly
    # at http://localhost:8000 (used by VITE_API_URL in local dev).
    # Traefik also routes Host=api-dev.velobits.dev → this container on port 80.
    ports:
      - "8000:8000"
    depends_on:
      ai-svc:
        condition: service_started
      text-svc:
        condition: service_started
      payments-svc:
        condition: service_started
      account-svc:
        condition: service_started
    networks:
      - fixmytext-net
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kong-dev.rule=Host(`api-dev.velobits.dev`)"
      - "traefik.http.routers.kong-dev.entrypoints=web"
      - "traefik.http.services.kong-dev.loadbalancer.server.port=8000"

  # ══════════════════════════════════════════════════════════════════════════
  # KEYCLOAK DEV  —  identity provider for the Velobits-Dev realm.
  # Dev realm export is at infrastructure/keycloak/realm-export-dev.json.
  # The prod equivalent (keycloak-prod) is provisioned during production deploy.
  # ══════════════════════════════════════════════════════════════════════════

  keycloak-dev-db:
    profiles: ["dev"]
    image: postgres:16-alpine
    container_name: keycloak-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DEV_DB_PASSWORD:?set KEYCLOAK_DEV_DB_PASSWORD in .env}
      POSTGRES_DB: keycloak_dev_db
    volumes:
      - keycloak-dev-pgdata:/var/lib/postgresql/data
    networks:
      - fixmytext-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak_dev_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  keycloak-dev:
    profiles: ["dev"]
    image: quay.io/keycloak/keycloak:26.0.8
    container_name: keycloak-dev
    restart: unless-stopped
    mem_limit: 1g
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-dev-db:5432/keycloak_dev_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DEV_DB_PASSWORD:?set KEYCLOAK_DEV_DB_PASSWORD in .env}
      # localhost makes OIDC discovery return http://localhost:8080 URLs, which
      # the browser can reach via the published port 8080 without /etc/hosts.
      # Switch to auth-dev.velobits.dev once you add the /etc/hosts entry (see README).
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KEYCLOAK_DEV_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_DEV_ADMIN_PASSWORD:-${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_DEV_ADMIN_PASSWORD in .env}}
    volumes:
      - ./infrastructure/keycloak/realm-export-dev.json:/opt/keycloak/data/import/realm.json:ro
      - ./infrastructure/keycloak/themes/fixmytext:/opt/keycloak/themes/fixmytext:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      keycloak-dev-db:
        condition: service_healthy
    networks:
      - fixmytext-net
    # KC_HEALTH_ENABLED=true exposes /health/ready on management port 9000.
    # The KC 26 UBI-micro image omits curl, so we use bash /dev/tcp to hit
    # the management health endpoint instead.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak-dev.rule=Host(`auth-dev.velobits.dev`)"
      - "traefik.http.routers.keycloak-dev.entrypoints=web"
      - "traefik.http.services.keycloak-dev.loadbalancer.server.port=8080"

  # ══════════════════════════════════════════════════════════════════════════
  # KEYCLOAK BOOTSTRAP  —  one-shot init that provisions identity providers
  # (Google / GitHub) and SMTP on the Velobits-Dev realm via the Admin API.
  # The realm itself is imported by keycloak-dev (--import-realm); this service
  # only adds the env-driven config that can't live in the realm JSON. It is
  # idempotent: bootstrap.sh exits 0 if the realm already exists, and skips each
  # IdP whose OAuth credentials are blank.
  #
  # NOTE: bootstrap.sh requires bash + curl + python3, none of which ship in the
  # keycloak:26.0 runtime image. We use alpine and `apk add` them (~7s) rather
  # than maintaining a custom Dockerfile. The script's own 60-attempt wait loop
  # is kept as a backstop even though depends_on waits for service_healthy.
  # ══════════════════════════════════════════════════════════════════════════

  keycloak-bootstrap:
    profiles: ["dev"]
    image: alpine:3
    container_name: keycloak-bootstrap
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - apk add --no-cache bash curl python3 >/dev/null && exec bash /scripts/bootstrap.sh
    environment:
      # Internal service address — bootstrap.sh waits on $KEYCLOAK_URL/health/ready.
      KEYCLOAK_URL: http://keycloak-dev:8080
      KEYCLOAK_REALM: Velobits-Dev
      KEYCLOAK_ADMIN: ${KEYCLOAK_DEV_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_DEV_ADMIN_PASSWORD:-${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_DEV_ADMIN_PASSWORD in .env}}
      REALM_EXPORT_PATH: /scripts/realm-export-dev.json
      # Social login (optional — blank values leave the buttons disabled).
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GH_OAUTH_CLIENT_ID: ${GH_OAUTH_CLIENT_ID:-}
      GH_OAUTH_CLIENT_SECRET: ${GH_OAUTH_CLIENT_SECRET:-}
      # SMTP (optional — gated on SMTP_HOST + SMTP_USERNAME inside the script).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    volumes:
      - ./infrastructure/keycloak/bootstrap.sh:/scripts/bootstrap.sh:ro
      - ./infrastructure/keycloak/realm-export-dev.json:/scripts/realm-export-dev.json:ro
    depends_on:
      keycloak-dev:
        condition: service_healthy
    networks:
      - fixmytext-net


# ── Shared network ────────────────────────────────────────────────────────────
networks:
  fixmytext-net:
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  fixmytext-pgdata:
  # Keycloak's identity database (separate from product DBs by design —
  # identity and product data are never co-located).
  keycloak-dev-pgdata:
