# fixmytext-backend — unified compose file with profiles.
#
# Profiles:
#   dev   development stack  (hot reload, source volumes)
#   prod  production stack   (multi-stage builds, nginx)
#
# Usage:
#   docker compose --profile dev up --build     # dev
#   docker compose --profile prod up --build    # prod
#
services:

  # ══════════════════════════════════════════════════════════════════════════
  # DATABASE  —  shared across profiles
  # ══════════════════════════════════════════════════════════════════════════

  db-service:
    image: pgvector/pgvector:pg16
    container_name: fixmytext-db
    restart: unless-stopped
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: fixmytext
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fixmytext_dev}
      POSTGRES_DB: fixmytext
    volumes:
      - fixmytext-pgdata:/var/lib/postgresql/data
    networks:
      - fixmytext-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixmytext -d fixmytext"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s


  # ══════════════════════════════════════════════════════════════════════════
  # REDIS  —  shared across profiles (optional, for distributed rate limiting)
  # ══════════════════════════════════════════════════════════════════════════

  redis-service:
    image: redis:8-alpine
    container_name: fixmytext-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    networks:
      - fixmytext-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5


  # ══════════════════════════════════════════════════════════════════════════
  # MIGRATE  —  runs alembic upgrade head once, then exits.
  # Uses the standalone migrations/ directory which imports models from
  # services/payments-svc (the canonical model source after monolith removal).
  # ══════════════════════════════════════════════════════════════════════════

  migrate-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: migrations/Dockerfile.migrate
    container_name: fixmytext-migrate-dev
    restart: "no"
    working_dir: /app
    command: ["alembic", "-c", "migrations/alembic.ini", "upgrade", "head"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://fixmytext:${POSTGRES_PASSWORD}@db-service:5432/fixmytext
    depends_on:
      db-service:
        condition: service_healthy
    networks:
      - fixmytext-net

  # ══════════════════════════════════════════════════════════════════════════
  # AI-SVC  —  Groq-backed AI text transformation service (dev profile)
  # Kong routes /api/v1/ai/* here.  Service is reachable only inside the
  # compose network; Kong owns the external :8000 port.
  # ══════════════════════════════════════════════════════════════════════════

  ai-svc:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: services/ai-svc/Dockerfile
    container_name: fixmytext-ai-svc
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=true
      - OTEL_SERVICE_NAME=fixmytext-ai-svc
    depends_on:
      redis-service:
        condition: service_started
    networks:
      - fixmytext-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ══════════════════════════════════════════════════════════════════════════
  # TEXT-SVC  —  local text transformation service (dev profile)
  # Kong routes /api/v1/text/* here.  Service is reachable only inside the
  # compose network; Kong owns the external :8000 port.
  # ══════════════════════════════════════════════════════════════════════════

  text-svc:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: services/text-svc/Dockerfile
    container_name: fixmytext-text-svc
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - OTEL_SERVICE_NAME=fixmytext-text-svc
    networks:
      - fixmytext-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ══════════════════════════════════════════════════════════════════════════
  # PAYMENTS-SVC  —  billing: passes, credits, subscriptions, Razorpay (dev)
  # Kong routes /api/v1/passes/* and /api/v1/subscription/* here.
  # Service is reachable only inside the compose network.
  # ══════════════════════════════════════════════════════════════════════════

  payments-svc:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: services/payments-svc/Dockerfile
    container_name: fixmytext-payments-svc
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - OTEL_SERVICE_NAME=fixmytext-payments-svc
      - DATABASE_URL=postgresql+asyncpg://fixmytext:${POSTGRES_PASSWORD}@db-service:5432/fixmytext
    depends_on:
      db-service:
        condition: service_healthy
      redis-service:
        condition: service_started
    networks:
      - fixmytext-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ══════════════════════════════════════════════════════════════════════════
  # ACCOUNT-SVC  —  user data, history, share (dev profile)
  # Kong routes /api/v1/user/*, /api/v1/history/*, /api/v1/share/* here.
  # Service is reachable only inside the compose network.
  # ══════════════════════════════════════════════════════════════════════════

  account-svc:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: services/account-svc/Dockerfile
    container_name: fixmytext-account-svc
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - OTEL_SERVICE_NAME=fixmytext-account-svc
      - DATABASE_URL=postgresql+asyncpg://fixmytext:${POSTGRES_PASSWORD}@db-service:5432/fixmytext
    depends_on:
      db-service:
        condition: service_healthy
      redis-service:
        condition: service_started
    networks:
      - fixmytext-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ══════════════════════════════════════════════════════════════════════════
  # KONG  —  API gateway (dev profile only for now)
  # Routes all /api/v1/* and /health traffic to the appropriate microservice.
  # The monolith is gone; account-svc now handles /api/v1/auth/* and /health.
  # ══════════════════════════════════════════════════════════════════════════

  kong:
    profiles: ["dev"]
    image: kong:3.8-ubuntu
    container_name: fixmytext-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "127.0.0.1:8001"
    volumes:
      - ./gateway/kong/kong.yml:/etc/kong/kong.yml:ro
    ports:
      - "8000:8000"
      - "127.0.0.1:8001:8001"
    depends_on:
      ai-svc:
        condition: service_started
      text-svc:
        condition: service_started
      payments-svc:
        condition: service_started
      account-svc:
        condition: service_started
    networks:
      - fixmytext-net
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ══════════════════════════════════════════════════════════════════════════
  # KEYCLOAK  —  identity provider (currently running but IDLE)
  # Realm import is idempotent (see infrastructure/keycloak/realm-export.json).
  # No users are provisioned. Frontend OIDC integration is TODO.
  # ══════════════════════════════════════════════════════════════════════════

  keycloak-db:
    profiles: ["dev"]
    image: postgres:16-alpine
    container_name: fixmytext-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      POSTGRES_DB: keycloak
    volumes:
      - keycloak-pgdata:/var/lib/postgresql/data
    networks:
      - fixmytext-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 3s
      retries: 5

  keycloak:
    profiles: ["dev"]
    image: quay.io/keycloak/keycloak:26.0
    container_name: fixmytext-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: localhost
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - ./infrastructure/keycloak/realm-export.json:/opt/keycloak/data/import/realm.json:ro
      - ./infrastructure/keycloak/themes/fixmytext:/opt/keycloak/themes/fixmytext:ro
    ports:
      - "8080:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - fixmytext-net

# ── Shared network ────────────────────────────────────────────────────────────
networks:
  fixmytext-net:
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  fixmytext-pgdata:
  # Keycloak's own Postgres data (separate from the app db-service)
  keycloak-pgdata:
