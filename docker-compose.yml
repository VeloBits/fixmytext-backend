# fixmytext-backend - development compose file.
#
# Profiles:
#   dev   development stack  (hot reload, source volumes)
#
# There is no prod profile - production is deployed separately (identity side:
# velobits-infra docs/keycloak-production-setup.md, prod services fetch JWKS
# from the public https://auth.velobits.dev URL, no shared network needed).
#
# Shared infrastructure (Traefik edge proxy + Keycloak identity provider)
# lives in the VeloBits/velobits-infra repo. That stack creates the external
# `velobits-proxy-net` network this file joins — START IT FIRST:
#   (velobits-infra)      docker compose up -d
#   (this repo)           docker compose --profile dev up --build
# App-only fallback without the infra stack (auth flows won't work):
#   docker network create velobits-proxy-net

services:
  # ══════════════════════════════════════════════════════════════════════════
  # PRODUCT DATABASES (velobits-dev-db Postgres instance)
  # Hosts fixmytext + chat + notes + futureapp databases. NEVER hosts
  # Keycloak's identity DB (which is a separate Postgres instance below).
  # ══════════════════════════════════════════════════════════════════════════

  db-service:
    image: pgvector/pgvector:pg16
    container_name: velobits-dev-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: fixmytext
      # Fail fast if unset rather than booting with a known weak default (M-13).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: fixmytext
    volumes:
      - fixmytext-pgdata:/var/lib/postgresql/data
      # First-init only: creates placeholder DBs for future products
      - ./infrastructure/db-init:/docker-entrypoint-initdb.d:ro
    networks:
      - fixmytext-backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixmytext -d fixmytext"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s


  # ══════════════════════════════════════════════════════════════════════════
  # REDIS  -  shared across profiles (optional, for distributed rate limiting)
  # ══════════════════════════════════════════════════════════════════════════

  redis-service:
    image: redis:8-alpine
    container_name: fixmytext-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    mem_limit: 128m
    cpus: "0.25"
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    networks:
      - fixmytext-backend-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping"]
      interval: 5s
      timeout: 3s
      retries: 5


  # ══════════════════════════════════════════════════════════════════════════
  # PGBOUNCER  -  connection pooler in transaction mode (dev profile).
  # Services route through :6432 when PGBOUNCER_URL is set in .env.
  # Caps total server-side connections at PGBOUNCER_DEFAULT_POOL_SIZE=20 while
  # allowing up to 200 client-side connections, preventing Postgres
  # max_connections exhaustion under multi-replica deployments.
  # ══════════════════════════════════════════════════════════════════════════

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p0
    profiles: ["dev"]
    container_name: fixmytext-pgbouncer
    environment:
      - DB_HOST=db-service
      - DB_PORT=5432
      - DB_NAME=fixmytext
      - DB_USER=fixmytext
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=200
      - DEFAULT_POOL_SIZE=20
    ports:
      - "127.0.0.1:6432:6432"
    depends_on:
      db-service:
        condition: service_healthy
    networks:
      - fixmytext-backend-net


  # ══════════════════════════════════════════════════════════════════════════
  # MIGRATE  -  runs each service's own alembic chain once, then exits.
  # Order matters: account-svc owns auth.users; payments-svc billing/usage tables
  # keep cross-schema FKs into it, so account-svc must migrate FIRST.
  # ══════════════════════════════════════════════════════════════════════════

  migrate-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: fixmytext-migrate-dev
    restart: "no"
    working_dir: /app
    command:
      - sh
      - -c
      - >-
        alembic -c services/account-svc/migrations/alembic.ini upgrade head &&
        alembic -c services/payments-svc/migrations/alembic.ini upgrade head
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://fixmytext:${POSTGRES_PASSWORD}@db-service:5432/fixmytext
    depends_on:
      db-service:
        condition: service_healthy
    networks:
      - fixmytext-backend-net

  # ══════════════════════════════════════════════════════════════════════════
  # AI-SVC  -  Groq-backed AI text transformation service (dev profile)
  # Kong routes /api/v1/ai/* here. Service is internal-only (Kong owns
  # the path-prefix seam; Traefik owns the subdomain seam).
  # ══════════════════════════════════════════════════════════════════════════

  ai-svc:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: services/ai-svc/Dockerfile
    container_name: fixmytext-ai-svc
    mem_limit: 512m
    cpus: "0.5"
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - OTEL_SERVICE_NAME=fixmytext-ai-svc
      - OTEL_EXPORTER_OTLP_ENDPOINT=
    depends_on:
      redis-service:
        condition: service_started
    networks:
      - fixmytext-backend-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ══════════════════════════════════════════════════════════════════════════
  # AI-WORKER  -  arq worker that executes async Groq jobs enqueued by ai-svc.
  # Runs the same Docker image as ai-svc but with the arq entrypoint.
  # ══════════════════════════════════════════════════════════════════════════

  ai-worker:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: services/ai-svc/Dockerfile
    container_name: fixmytext-ai-worker
    mem_limit: 256m
    cpus: "0.25"
    command: ["python", "-m", "arq", "app.worker.main.WorkerSettings"]
    env_file:
      - .env
    environment:
      - OTEL_SERVICE_NAME=fixmytext-ai-worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=
    depends_on:
      redis-service:
        condition: service_started
    networks:
      - fixmytext-backend-net
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import redis, os; redis.from_url(os.environ[\"REDIS_URL\"]).ping()'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ══════════════════════════════════════════════════════════════════════════
  # TEXT-SVC  -  local text transformation service (dev profile)
  # Kong routes /api/v1/text/* here.
  # ══════════════════════════════════════════════════════════════════════════

  text-svc:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: services/text-svc/Dockerfile
    container_name: fixmytext-text-svc
    mem_limit: 256m
    cpus: "0.25"
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - OTEL_SERVICE_NAME=fixmytext-text-svc
      - OTEL_EXPORTER_OTLP_ENDPOINT=
    networks:
      - fixmytext-backend-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ══════════════════════════════════════════════════════════════════════════
  # PAYMENTS-SVC  -  billing: passes, credits, subscriptions, Razorpay (dev)
  # Kong routes /api/v1/passes/* and /api/v1/subscription/* here.
  # ══════════════════════════════════════════════════════════════════════════

  payments-svc:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: services/payments-svc/Dockerfile
    container_name: fixmytext-payments-svc
    mem_limit: 256m
    cpus: "0.25"
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - OTEL_SERVICE_NAME=fixmytext-payments-svc
      - OTEL_EXPORTER_OTLP_ENDPOINT=
      - DATABASE_URL=postgresql+asyncpg://fixmytext:${POSTGRES_PASSWORD}@db-service:5432/fixmytext
    depends_on:
      db-service:
        condition: service_healthy
      redis-service:
        condition: service_started
    networks:
      - fixmytext-backend-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ══════════════════════════════════════════════════════════════════════════
  # ACCOUNT-SVC  -  user data, history, share, session cookie (dev profile)
  # Kong routes /api/v1/auth/*, /api/v1/user/*, /api/v1/history/*,
  # /api/v1/share/* here.
  # ══════════════════════════════════════════════════════════════════════════

  account-svc:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: services/account-svc/Dockerfile
    container_name: fixmytext-account-svc
    mem_limit: 512m
    cpus: "0.5"
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - OTEL_SERVICE_NAME=fixmytext-account-svc
      - OTEL_EXPORTER_OTLP_ENDPOINT=
      - DATABASE_URL=postgresql+asyncpg://fixmytext:${POSTGRES_PASSWORD}@db-service:5432/fixmytext
      - SESSION_COOKIE_SECRET=${SESSION_COOKIE_SECRET}
      - SESSION_COOKIE_NAME=${SESSION_COOKIE_NAME:-fixmytext_session}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
      - SESSION_COOKIE_MAX_AGE=${SESSION_COOKIE_MAX_AGE:-604800}
      - SESSION_COOKIE_DOMAIN=${SESSION_COOKIE_DOMAIN:-}
      # keycloak-dev resolves over velobits-proxy-net (velobits-infra stack).
      - KEYCLOAK_URL=${KEYCLOAK_URL:-https://auth-dev.velobits.dev}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-Velobits-Dev}
      - KEYCLOAK_JWKS_URL=${KEYCLOAK_JWKS_URL:-https://auth-dev.velobits.dev/realms/${KEYCLOAK_REALM:-Velobits-Dev}/protocol/openid-connect/certs}
      - KEYCLOAK_SERVICE_ACCOUNT_ID=${KEYCLOAK_SERVICE_ACCOUNT_ID:-account-svc}
      - KEYCLOAK_SERVICE_ACCOUNT_SECRET=${KEYCLOAK_SERVICE_ACCOUNT_SECRET:-}
    depends_on:
      db-service:
        condition: service_healthy
      redis-service:
        condition: service_started
    networks:
      - fixmytext-backend-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ══════════════════════════════════════════════════════════════════════════
  # KONG  -  API gateway. Behind Traefik (velobits-infra stack); routes
  # /api/v1/* to services. Joins velobits-proxy-net so Traefik can route
  # api-dev.velobits.dev → kong:8000 and Keycloak can POST backchannel logouts.
  # ══════════════════════════════════════════════════════════════════════════

  kong:
    profiles: ["dev"]
    image: kong:3.8-ubuntu
    container_name: fixmytext-kong
    restart: unless-stopped
    mem_limit: 768m
    cpus: "0.50"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "127.0.0.1:8001"
    volumes:
      - ./gateway/kong/kong.yml:/etc/kong/kong.yml:ro
    # Sockets are ephemeral runtime state; tmpfs guarantees a clean dir on
    # every start so a stale worker-events socket from an unclean shutdown
    # can never crash-loop the gateway (nginx: bind() Address already in use).
    tmpfs:
      - /usr/local/kong/sockets:size=1m
    # Port 8000 is published to localhost only so the browser can reach Kong at
    # http://localhost:8000 (VITE_API_URL in local dev). Binding to 127.0.0.1
    # prevents Kong's proxy from being reachable on LAN/shared networks.
    # Traefik also routes Host=api-dev.velobits.dev → this container on port 80.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      ai-svc:
        condition: service_started
      text-svc:
        condition: service_started
      payments-svc:
        condition: service_started
      account-svc:
        condition: service_started
    networks:
      - fixmytext-backend-net
      - velobits-proxy-net
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  fixmytext-backend-net:
    name: fixmytext-backend-net
    driver: bridge
  velobits-proxy-net:
    name: velobits-proxy-net
    external: true

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  fixmytext-pgdata:
