# Railway config-as-code for ai-svc — build from source.
#
# Dashboard setup for this Railway service:
#   • Config-as-Code path : services/ai-svc/railway.toml
#   • Root Directory      : /   (repo root — the Dockerfile COPYs shared/ and
#                                 services/ai-svc/, so it needs repo-root context)
#   • Branch auto-deploy  : DISABLED. Deploys are driven only by the CI-gated
#                           GitHub Actions workflow (.github/workflows/deploy-railway.yml)
#                           so nothing ships without green CI (H-7).
#                           Branch -> env: develop -> development, main -> production.

[build]
builder = "DOCKERFILE"
dockerfilePath = "services/ai-svc/Dockerfile"

[deploy]
# Railway injects $PORT at runtime; bind to it.
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1

[environments.production.deploy]
restartPolicyType = "ALWAYS"
numReplicas = 1

[environments.development.deploy]
restartPolicyType = "ON_FAILURE"
numReplicas = 1
