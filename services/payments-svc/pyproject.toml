[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]
ignore = [
    "E501",
    "B008",
    "UP007",
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"app/db/models/*.py" = ["F821"]  # SQLAlchemy Mapped["Type"] forward refs
# Alembic migrations: auto-generated; SA types imported for column defs (F401),
# import ordering not meaningful (I001), env.py imports after sys.path edits (E402).
"migrations/versions/*.py" = ["F401", "I001"]
"migrations/env.py" = ["E402", "I001", "F401"]

