[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Matches root pyproject.toml — run ruff from repo root for consistent behaviour.
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]
ignore = [
    "E501",   # line-too-long — handled by formatter
    "B008",   # function calls in default args (FastAPI Depends pattern)
    "UP007",  # use-x-or-y-for-union
    "SIM108", # ternary-operator — sometimes less readable
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"app/db/models/*.py" = ["F821"]  # SQLAlchemy Mapped["Type"] forward refs

